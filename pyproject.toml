[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "car-detection-yolo"
version = "1.0.0"
description = "YOLO-based vehicle detection with Streamlit UI, training pipeline, and COCO dataset tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.50",
    "ultralytics>=8.0",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "numpy>=1.24",
    "pycocotools>=2.0",
    "albumentations>=1.3",
    "pandas>=2.0",
    "tqdm>=4.64",
]

[project.scripts]
car-detect = "run:main"
car-train = "train:main"
car-prepare = "prepare_data:prepare_coco_val_subset"
car-evaluate = "evaluate:benchmark_models"

[tool.setuptools.packages.find]
include = ["car_detection_yolo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
